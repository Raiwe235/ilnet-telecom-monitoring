global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'ilnet-telecom'
    platform: 'production'
    region: 'senegal'

# AlertManager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert and recording rules
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/recording_rules.yml'

# Scrape configurations
scrape_configs:
  # === Prometheus Self-monitoring ===
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 10s

  # === SNMP Collector ===
  - job_name: 'snmp-collector'
    static_configs:
      - targets: ['snmp-collector:8000']
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'collector'

  # === Node Exporter (Host Metrics) ===
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host'

  # === Network Devices via SNMP ===
  - job_name: 'network-devices'
    static_configs:
      - targets:
          - '192.168.1.1'    # Router principal
          - '192.168.1.2'    # Switch core
          - '192.168.1.3'    # Switch access
        labels:
          device_type: 'network'
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: '/snmp'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: __scheme__
        replacement: 'http'

  # === Redis Exporter ===
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cache'
