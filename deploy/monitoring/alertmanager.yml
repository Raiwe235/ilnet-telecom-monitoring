global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'device_id']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 4h
    
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 12h

receivers:
  - name: 'default'
    # Webhook for default alerts
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true
  
  - name: 'critical'
    # Multiple channels for critical alerts
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true
    # Uncomment to enable email
    # email_configs:
    #   - to: 'ops@ilnet-telecom.sn'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alerts@ilnet-telecom.sn'
    #     auth_password: 'password'
  
  - name: 'warning'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/warning'
        send_resolved: true

inhibit_rules:
  # Inhibit interface alerts if device is down
  - source_match:
      alertname: 'DeviceDown'
    target_match:
      alertname: 'InterfaceDown'
    equal: ['device_id']
